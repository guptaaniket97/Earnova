<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Earnova - My Links</title>

<link rel="stylesheet"
    href="my-links.css">

</head><body><!-- =========================
     HEADER
========================== -->

<header class="links-header">

    <div class="logo">
    <img
        src="Earnova img.jpeg"
        alt="Earnova Logo"
    >
</div>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="offers.html">
            Offers
        </a>

        <a href="my-links.html">
            My Links
        </a>

        <a href="earnings.html">
            Earnings
        </a>

        <a href="withdraw.html">
            Withdraw
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>



<!-- =========================
     MAIN
========================== -->

<main class="links-main">

    <h1>
        My Affiliate Links
    </h1>


    <p class="subtitle">
        Manage the links you have generated from Earnova offers.
    </p>



    <!-- =========================
         FASHION STORE
    ========================== -->

    <div class="link-card">

        <div>

            <h2>
                🛍️ Fashion Store
            </h2>


            <p
                class="affiliate-link"
                id="fashionLink">

                -

            </p>


            <p class="stats">

                Clicks:

                <strong id="fashionClicks">
                    0
                </strong>

            </p>

        </div>


        <button id="fashionCopy">
            Copy Link
        </button>

    </div>



    <!-- =========================
         TECH PRODUCTS
    ========================== -->

    <div class="link-card">

        <div>

            <h2>
                📱 Tech Products
            </h2>


            <p
                class="affiliate-link"
                id="techLink">

                -

            </p>


            <p class="stats">

                Clicks:

                <strong id="techClicks">
                    0
                </strong>

            </p>

        </div>


        <button id="techCopy">
            Copy Link
        </button>

    </div>



    <!-- =========================
         ONLINE COURSES
    ========================== -->

    <div class="link-card">

        <div>

            <h2>
                📚 Online Courses
            </h2>


            <p
                class="affiliate-link"
                id="courseLink">

                -

            </p>


            <p class="stats">

                Clicks:

                <strong id="courseClicks">
                    0
                </strong>

            </p>

        </div>


        <button id="courseCopy">
            Copy Link
        </button>

    </div>

</main>



<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<!-- =========================
     JAVASCRIPT
========================== -->

<script>

    /*
    ========================================
    LOAD MY LINKS
    ========================================
    */

    async function loadMyLinks() {


        /*
        Get REAL logged-in user
        from Supabase
        */

        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();


        /*
        If user is not logged in
        */

        if (error || !user) {

            alert(
                "Please login to view your links."
            );

            window.location.href =
                "index.html";

            return;

        }



        /*
        ========================================
        UNIQUE REFERRAL ID
        ========================================
        */

        const referralId =
            "EV" +
            user.id
                .replace(/-/g, "")
                .substring(0, 10)
                .toUpperCase();



        /*
        ========================================
        CREATE LINKS
        ========================================
        */

        const fashionLink =
            "https://earnova-demo.com/offer/1?ref=" +
            referralId;


        const techLink =
            "https://earnova-demo.com/offer/2?ref=" +
            referralId;


        const courseLink =
            "https://earnova-demo.com/offer/3?ref=" +
            referralId;



        /*
        ========================================
        SHOW LINKS
        ========================================
        */

        document.getElementById(
            "fashionLink"
        ).textContent =
            fashionLink;


        document.getElementById(
            "techLink"
        ).textContent =
            techLink;


        document.getElementById(
            "courseLink"
        ).textContent =
            courseLink;



        /*
        ========================================
        USER-WISE STATS KEY
        ========================================
        */

        const userStatsKey =
            "earnovaUserStats_" +
            user.id;



        /*
        ========================================
        GET ONLY THIS USER'S STATS
        ========================================
        */

        const userStats =
            JSON.parse(
                localStorage.getItem(
                    userStatsKey
                )
            ) || {

                fashionClicks: 0,

                techClicks: 0,

                courseClicks: 0,

                earnings: 0

            };



        /*
        ========================================
        SHOW CLICK COUNTS
        ========================================
        */

        document.getElementById(
            "fashionClicks"
        ).textContent =
            Number(
                userStats.fashionClicks
            ) || 0;


        document.getElementById(
            "techClicks"
        ).textContent =
            Number(
                userStats.techClicks
            ) || 0;


        document.getElementById(
            "courseClicks"
        ).textContent =
            Number(
                userStats.courseClicks
            ) || 0;



        /*
        ========================================
        COPY FUNCTION
        ========================================
        */

        async function copyLink(link) {

            try {

                await navigator.clipboard
                    .writeText(link);

                alert(
                    "Affiliate link copied!\n\n" +
                    link
                );

            }

            catch (error) {

                alert(
                    "Unable to copy the link."
                );

            }

        }



        /*
        ========================================
        COPY BUTTONS
        ========================================
        */

        document.getElementById(
            "fashionCopy"
        ).onclick =
            function () {

                copyLink(
                    fashionLink
                );

            };


        document.getElementById(
            "techCopy"
        ).onclick =
            function () {

                copyLink(
                    techLink
                );

            };


        document.getElementById(
            "courseCopy"
        ).onclick =
            function () {

                copyLink(
                    courseLink
                );

            };

    }



    /*
    ========================================
    START
    ========================================
    */

    loadMyLinks();

</script>

</body></html>
